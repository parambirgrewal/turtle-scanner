name: premarket-brief

on:
  # Scheduled execution migrated to Google Apps Script on 2026-10-25.
  # Original configuration is preserved on backup-before-apps-script-2026-10-25.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "pandas>=2.2" numpy yfinance requests pyswisseph

      - name: Build and send brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python premarket_brief.py

      - name: Save FII/DII history
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || (git commit -m "update FII/DII history" && git push)
